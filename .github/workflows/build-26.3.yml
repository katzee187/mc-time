name: Build GameTime for Minecraft 26.3

on:
  push:
    paths:
      - 'versions/26.3/**'
      - '.github/workflows/build-26.3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle 9.7.1
        run: |
          curl -L --fail https://services.gradle.org/distributions/gradle-9.7.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.7.1/bin" >> "$GITHUB_PATH"
      - name: Build Minecraft 26.3 mod
        working-directory: versions/26.3
        run: gradle build --no-daemon
      - name: Upload Minecraft 26.3 JAR
        uses: actions/upload-artifact@v4
        with:
          name: gametime-fabric-26.3
          path: versions/26.3/build/libs/*.jar
          if-no-files-found: error
